<!doctype html>
<html lang="de">
<head>
<script src="lgh-vorlade.js"></script><!--lgh-->

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Billiard</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gl"></canvas>
<div id="hud" class="hidden">
  <div id="top"></div>
  <div id="tray"></div>
  <div id="msg"></div>
  <div id="timer"><i></i></div>
  <div id="left">
    <div id="spin" aria-label="Treffpunkt auf der Kugel"><i></i></div>
    <div id="fine"><button id="fl" aria-label="Feiner nach links">&#9664;</button><button id="fr" aria-label="Feiner nach rechts">&#9654;</button></div>
  </div>
  <div id="power" aria-label="Stärke"><div id="track"><div id="fill"></div><div id="thumb"></div></div><div id="plabel">0</div></div>
  <div id="side">
    <button id="bmenu" aria-label="Menü">&#9776;</button>
  </div>
  <div id="hint"></div>
</div>
<div id="screen" class="screen"></div>
<div id="modal" class="modal hidden"></div>
<div id="boot"><div class="spinner"></div><div>Billiard wird geladen …</div></div>
<script type="module" src="js/main.js"></script>
<!--lgh-start--><script>window.LGH_SPIEL='billiard';window.LGH_POS='bc';window.LGH_EIGENER_KNOPF=true;</script><script src="lgh-modul.js"></script><!--lgh-ende-->
</body>
</html>
